<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hashtagger — UI preview (mocked)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: transparent; color: var(--foreground, #e7ecf5);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 720px; padding: 8px 0 20px; }
  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.5px; }
  header h1 .dot { color: var(--accent, #22d3ee); }
  header p { margin: 0 0 20px; color: var(--muted-foreground, #8ea0c0); font-size: 14px; }
  .card {
    background: var(--card, #131c31); border: 1px solid var(--border, #26324f);
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
  }
  label { display: block; font-size: 11px; text-transform: uppercase;
          letter-spacing: 0.08em; color: var(--muted-foreground, #8ea0c0); margin-bottom: 7px; }
  textarea, select, input[type=number], input[type=text] {
    width: 100%; background: var(--card, #1b2540); color: var(--foreground, #e7ecf5);
    border: 1px solid var(--border, #26324f); border-radius: 8px; padding: 10px;
    font: inherit; resize: vertical;
  }
  textarea { min-height: 92px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .row > div { flex: 1 1 150px; }
  button {
    margin-top: 14px; width: 100%; cursor: pointer;
    background: linear-gradient(180deg, var(--accent, #22d3ee), #0891b2);
    color: #04212b; border: 0; border-radius: 8px; padding: 12px 18px;
    font: 600 15px/1 inherit;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card, #1b2540); border: 1px solid var(--border, #26324f);
    border-radius: 999px; padding: 6px 12px; margin: 0 7px 7px 0; font-size: 13px;
  }
  .tag .score { color: var(--muted-foreground, #8ea0c0); font-size: 11px; }
  .tag.trending { border-color: #34d399; }
  .tag.trending::before { content: "▲"; color: #34d399; font-size: 9px; }
  .meta { color: var(--muted-foreground, #8ea0c0); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hash<span class="dot">tagger</span></h1>
    <p>Paste a post, get ranked, trending hashtags. <span style="font-size:11px;border:1px solid var(--border,#26324f);border-radius:999px;padding:2px 8px;color:var(--muted-foreground,#8ea0c0)">API online</span></p>
  </header>

  <div class="card">
    <label>Your post</label>
    <textarea readonly>Just shipped a new AI feature that cuts deploy time in half 🚀</textarea>
    <div class="row">
      <div><label>Platform</label><input type="text" readonly value="Instagram" /></div>
      <div><label>Max tags</label><input type="number" readonly value="5" /></div>
      <div><label>Tone</label><input type="text" readonly value="professional" /></div>
    </div>
    <button>Generate hashtags</button>
    <div class="meta">Done.</div>
  </div>

  <div class="card">
    <label>Ranked hashtags (5 of max 5)</label>
    <div>
      <span class="tag trending">#ai <span class="score">93%</span></span>
      <span class="tag trending">#buildinpublic <span class="score">81%</span></span>
      <span class="tag trending">#devtools <span class="score">74%</span></span>
      <span class="tag">#machinelearning <span class="score">62%</span></span>
      <span class="tag">#startups <span class="score">55%</span></span>
    </div>
    <div class="meta">platform: instagram · model: gpt-4o-mini</div>
  </div>
</div>
</body>
</html>
